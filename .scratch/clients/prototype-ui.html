    <style>
        .variant {
            display: none;
        }

        .variant.active {
            display: block;
        }

        #prototype-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 999px;
            display: flex;
            gap: 12px;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            color: white;
            align-items: center;
        }

        #prototype-controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        #prototype-controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #prototype-controls button.active {
            background: #FF2D37;
            /* sx-red */
            border-color: #FF2D37;
        }

        /* Marquee Animation */
        @keyframes scroll-x {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            animation: scroll-x 40s linear infinite;
        }

        .marquee-container:hover .animate-marquee {
            animation-play-state: paused;
        }

        /* Generic Logo SVGs */
        .logo-placeholder {
            height: 40px;
            width: auto;
            max-width: 150px;
            fill: currentColor;
            transition: all 0.3s ease;
        }

        /* Removed grayscale styling so they retain their original colors */
        .client-logo-wrapper {
            transition: transform 0.3s ease;
        }

        .marquee-container .client-logo-wrapper:hover {
            transform: scale(1.05);
        }
    </style>

        <button onclick="setVariant('v1')" id="btn-v1" class="active">Infinite Marquee</button>
        <button onclick="setVariant('v2')" id="btn-v2">Minimal Grid</button>
        <button onclick="setVariant('v3')" id="btn-v3">Floating Badges</button>
    </div>

    <script>
        function setVariant(id) {
            document.querySelectorAll('.variant').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            document.querySelectorAll('#prototype-controls button').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');

            // Update URL search param for shareability
            const url = new URL(window.location);
            url.searchParams.set('v', id);
            window.history.pushState({}, '', url);
        }

        // Initialize from URL if present
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const v = urlParams.get('v');
            if (v && ['v1', 'v2', 'v3'].includes(v)) {
                setVariant(v);
            }
        });
    </script>
